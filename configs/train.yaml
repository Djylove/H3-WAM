# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
eval_every: 50
eval_num_inference_steps: 10

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null

# text embedding precompute options
overwrite: true
override_instruction: null

# standalone hierarchical generation test options
test:
  checkpoint_path: null
  dataset_stats_path: null
  output_dir: ./runs/hierarchical_test/${now:%Y-%m-%d}_${now:%H-%M-%S}
  device: cuda:0
  num_samples: 4
  sample_indices: null
  random_samples: true
  seed: 42
  high_video_inference_steps: [10,30,50]
  low_video_inference_steps: [10,30,50]
  num_inference_steps: 20
  fps: 8
  rand_device: cpu
  tiled: false

# wandb
wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
