# @package _global_

defaults:
  - train
  - override /task: robotwin_uncond_3cam_384_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  robotwin_root: third_party/RoboTwin
  policy_name: fastwam_policy
  task_name: null
  task_config: demo_randomized
  instruction_type: unseen
  eval_num_episodes: 10
  output_dir: ./evaluate_results/robotwin/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Action inference
  action_horizon: ${oc.select:action_horizon,32}
  replan_steps: ${oc.select:replan_steps,32}
  num_inference_steps: ${oc.select:num_inference_steps,${eval_num_inference_steps}}
  high_video_inference_steps: ${oc.select:high_video_inference_steps,null}
  low_video_inference_steps: ${oc.select:low_video_inference_steps,null}
  high_denoise_step: ${oc.select:high_denoise_step,null}
  low_denoise_step: ${oc.select:low_denoise_step,null}
  high_reuse_step: ${oc.select:high_reuse_step,null}
  low_reuse_step: ${oc.select:low_reuse_step,null}
  action_inference_steps: ${oc.select:action_inference_steps,null}
  joint_denoise: ${oc.select:joint_denoise,false}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  timing_enabled: false
  skip_get_obs_within_replan: true

  # Optional attention visualization for Robotwin deploy.
  attention_viz_enabled: false
  attention_viz_output_dir: null
  attention_viz_steps: null      # null => middle denoise step only; supports e.g. [0, 5, -1]
  attention_viz_layers: [-1]     # negative indices are relative to MoT depth
  attention_viz_max_plans: -1      # -1 => all replans/chunks in each episode
  attention_viz_max_records: 128
  attention_viz_query_chunk_size: 256
  attention_viz_alpha: 0.55
  attention_viz_video_fps: 4

  # Runtime inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  enabled: false
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
