# @package _global_

defaults:
  - override /data: robotwin
  - override /model: fastwam_hierarchical
  - _self_

# dataloading
batch_size: 1
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  hierarchical_num_chunks: 4
  hierarchical_chunk_action_horizon: 32
  hierarchical_high_stride: 2
  hierarchical_low_stride: 1
  hierarchical_mask_high_predict: false
  hierarchical_mask_low_predict: true

# robotwin eval/deploy controls (consumed by sim_robotwin via EVALUATION)
action_horizon: ${model.hierarchical_chunk_action_horizon}
replan_steps: ${action_horizon}
num_inference_steps: ${eval_num_inference_steps}
high_video_inference_steps: 1
low_video_inference_steps: 5
action_inference_steps: 20

data:
  train:
    num_frames: 129
    action_video_freq_ratio: 4
  val:
    num_frames: 129
    action_video_freq_ratio: 4

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500
eval_num_inference_steps: 20

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
